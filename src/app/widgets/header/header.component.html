<header class="p-3 bg-dark text-white fixed-top">
  <div class="container">
    <app-toast-container />
    <div class="d-flex flex-wrap align-items-center justify-content-between">
      <!-- Логотип и десктопные ссылки -->
      <div class="d-flex align-items-center">
        <a [routerLink]="['']" class="logo__link">
          <img class="icon me-2" height="65" src="/assets/pictures/header/nnstu.svg" alt="Логотип">
        </a>

        <!-- Десктопные ссылки -->
        <div class="desktop-nav">
          <ul class="nav mb-0">
            <li class="nav-item" (click)="toPage('conferences')">
              <a class="nav-link px-2 text-white head-text">Конференции</a>
            </li>
            <li class="nav-item" (click)="toPage('jobs')" *ngIf="checkLogin() && !isAdmin()">
              <a class="nav-link px-2 text-white head-text">Мои статьи</a>
            </li>
            <li class="nav-item" (click)="toPage('all-users')" *ngIf="checkLogin() && isAdmin()">
              <a class="nav-link px-2 text-white head-text">Пользователи</a>
            </li>
          </ul>
        </div>
      </div>

      <div class="d-flex align-items-center gap-3">
        <!-- Мобильное меню -->
        <div class="mobile-nav">
          <button class="navbar-toggler" type="button" (click)="toggleMobileMenu()">
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="nav-links" [class.active]="isMobileMenuOpen">
            <!-- Повтор ссылок для мобильной версии -->
            <li class="nav-item" (click)="toPage('conferences'); isMobileMenuOpen = false">
              <a class="nav-link text-white head-text">Конференции</a>
            </li>
            <li class="nav-item" (click)="toPage('jobs'); isMobileMenuOpen = false" *ngIf="checkLogin() && !isAdmin()">
              <a class="nav-link text-white head-text">Мои статьи</a>
            </li>
            <li class="nav-item" (click)="toPage('all-users'); isMobileMenuOpen = false" *ngIf="checkLogin() && isAdmin()">
              <a class="nav-link text-white head-text">Пользователи</a>
            </li>
          </div>
        </div>

        <!-- Оригинальные элементы справа -->
        <div class="text-end" *ngIf="!checkLogin()">
          <a routerLink="/auth" class="btn btn-outline-light me-2">Вход</a>
          <a routerLink="/auth" [queryParams]="{ register: '1' }" class="btn btn-warning">
            <i class="bi bi-r-circle-fill"></i>
            <span>Регистрация</span>
          </a>
        </div>

        <div *ngIf="checkLogin()" class="d-flex flex-column flex-md-row align-items-center gap-2">
          <div class="dropdown order-1 order-md-2">
            <a class="dropdown-toggle text-white text-decoration-none head-text d-inline-flex align-items-center gap-2"
               data-bs-toggle="dropdown">
              <i class="bi bi-person-fill flex-shrink-0"></i>
              <span class="desktop-name d-none d-md-inline" [title]="currentUser.firstName + ' ' + currentUser.lastName">
                {{ (currentUser.firstName | firstWord | shortName:15) || '' }}
                {{ (currentUser.lastName | firstWord | shortName:15) || '' }}
              </span>
            </a>
            <ul class="dropdown-menu dropdown-menu-end">
              <li><a class="dropdown-item" (click)="toPage('profile')">Профиль</a></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item text-danger" (click)="logout()">Выход</a></li>
            </ul>
          </div>
        </div>

      </div>
    </div>
  </div>
</header>
