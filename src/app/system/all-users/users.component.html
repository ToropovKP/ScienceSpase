<section id="personal-account__client">
  <div class="container">

    <div class="main">
      <div class="row d-flex align-items-center konf-pref rounded-3">
        <div class="d-inline-flex align-items-center col-10">
          <div class="text-black" style="font-size: 20px; margin-left: 10px;">
            Все пользователи
          </div>
        </div>
      </div>

      <p-table #dt [value]="users"
               (sortFunction)="customSort($event)"
               [customSort]="true"
               [scrollable]="true"
               scrollHeight="400px"
               [tableStyle]="{ 'min-width': '50rem' }">
        <ng-template #header>
          <tr>
            <th pSortableColumn="fio">
              Фамилия И.О. <p-sortIcon field="fio" />
            </th>
            <th> Телефон </th>
            <th> Почта </th>
            <th> Статус </th>
            <th> Роль </th>
            <th style="width: 5rem">Профиль</th>
          </tr>
        </ng-template>
        <ng-template #body let-user>
          <tr>
            <td>{{ user.lastName + ' ' + user.firstName + ' ' + user.middleName }}</td>
            <td>{{ user.phone }}</td>
            <td>{{ user.email }}</td>
            <td [style.color]="user.status == 'ACTIVE' ? 'green' : '#D80000'">{{ userStatusMap[user.status] }}</td>
            <td [style.color]="user.role == 'ADMIN' ? '#334FFF' : 'black'">{{ userRoleMap[user.role] }}</td>
            <td>
              <p-button icon="pi pi-search" (click)="openProfile(user.id)" severity="secondary" rounded/>
            </td>
          </tr>
        </ng-template>
      </p-table>
