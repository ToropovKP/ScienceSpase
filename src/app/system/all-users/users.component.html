      <div class="row konf-information" style="margin-bottom: 20px;">

        <div class="row conf-info-section-item">
          <div class="col-3 conf-info-section">
            <div class="conf-section-title text-center text-white rounded-3">Фамилия И.О.</div>
          </div>
          <div class="col-2 conf-info-section" style="padding-left: 5px;">
            <div class="conf-section-title text-center text-white rounded-3">Телефон</div>
          </div>
          <div class="col-2 conf-info-section" style="padding-left: 5px;">
            <div class="conf-section-title text-center text-white rounded-3">Почта</div>
          </div>
          <div class="col-2 conf-info-section" style="padding-left: 5px;">
            <div class="conf-section-title text-center text-white rounded-3">Статус</div>
          </div>
          <div class="col-2 conf-info-section" style="padding-left: 5px;">
            <div class="conf-section-title text-center text-white rounded-3">Роль</div>
          </div>
          <div class="col-1 conf-info-section" style="padding-left: 5px;">
            <div class="conf-section-title text-center text-white rounded-3">Профиль</div>
          </div>
        </div>

        <div class="d-flex justify-content-center" *ngIf="this.users.length == 0">
          <div class="spinner-border" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
        </div>

        <div class="row conf-info-section-item" *ngFor="let user of this.users">
          <div class="col-3 conf-info-section">
            <div class="users-list-text text-center text-black rounded-3">{{ user.lastName + ' ' + user.firstName + ' ' + user.middleName }}</div>
          </div>
          <div class="col-2 conf-info-section" style="padding-left: 5px;">
            <div class="users-list-text text-center text-black rounded-3">{{ user.phone }}</div>
          </div>
          <div class="col-2 conf-info-section" style="padding-left: 5px;">
            <div class="users-list-text text-center text-black rounded-3">{{ user.email }}</div>
          </div>
          <div class="col-2 conf-info-section" style="padding-left: 5px;">
            <div class="users-list-text text-center rounded-3" [style.color]="user.status == 'ACTIVE' ? 'green' : '#D80000'">{{ userStatusMap.get(user.status) }}</div>
          </div>
          <div class="col-2 conf-info-section" style="padding-left: 5px;">
            <div class="users-list-text text-center rounded-3" [style.color]="user.role == 'ADMIN' ? '#334FFF' : 'black'">{{ userRoleMap.get(user.role) }}</div>
          </div>
          <div class="col-1 conf-info-section" style="padding-left:5px; cursor: pointer">
            <div class="users-list-text text-center text-black rounded-3 download-pointer" (click)="openProfile(user.id)">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M13.5002 13.5L19.0003 19" stroke="black" stroke-width="1.5" stroke-linecap="round"
                      stroke-linejoin="round"/>
                <circle cx="8" cy="8" r="7.25" stroke="black" stroke-width="1.5"/>
              </svg>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</section>
