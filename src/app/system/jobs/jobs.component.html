<section id="container__main">
  <div class="container">
    <p-toast [breakpoints]="{ '768px': { width: '90%', right: '0', left: '20px' } }" />
    <div class="main">
      <!-- Заголовок -->
      <div class="article-page d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
        <h2 class="h3 text-black mb-0 flex-grow-1" style="min-width: 300px;">
          Мои статьи
          <div *ngIf="currentConferenceId && loadingConference" class="text-center">
            <div class="spinner-border" role="status">
              <span class="visually-hidden">Загрузка...</span>
            </div>
          </div>
          <span *ngIf="currentConferenceId && !loadingConference" class="d-block d-md-inline text-truncate">
            / {{currentConference.title}}
          </span>
        </h2>
      </div>

      <div *ngIf="loadingJobs" class="text-center">
        <div class="spinner-border" role="status">
          <span class="visually-hidden">Загрузка...</span>
        </div>
      </div>

      <!-- Пустой список -->
      <div *ngIf="!loadingJobs && !jobs?.length" class="text-center py-5 bg-light rounded-3">
        <div class="h4 text-muted mb-3">Нет добавленных статей</div>
        <i class="bi bi-file-earmark-x fs-1 text-secondary"></i>
      </div>

      <!-- Список статей -->
      <div *ngIf="!loadingJobs && jobs?.length" class="article-list">
        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
          <div class="col" *ngFor="let job of jobs">
            <div class="card h-100 shadow-sm">
              <!-- Заголовок -->
              <div class="card-header bg-primary text-white">
                <h3 class="h5 mb-0 text-truncate">{{ job.title }}</h3>
              </div>

              <!-- Тело карточки -->
              <div class="card-body">
                <div class="d-flex flex-column gap-2">
                  <div class="d-flex align-items-center gap-2">
                    <i class="bi bi-journal-text text-primary"></i>
                    <span class="conference-text text-muted">
                      {{ job.conferenceTitle }}
                    </span>
                  </div>

                  <div class="d-flex align-items-center gap-2">
                    <i class="bi bi-person-circle text-primary"></i>
                    <span class="text-break"
                          [class.text-success]="job.userId === currentUser.id"
                          [class.text-danger]="job.userId !== currentUser.id">
                      {{ job.userName }}
                    </span>
                  </div>
                </div>
              </div>

              <!-- Футер -->
              <div class="card-footer bg-transparent border-top-0">
                <button class="btn btn-outline-primary w-100"
                        (click)="openJob(job.id)">
                  <i class="bi bi-box-arrow-in-right me-2"></i>Открыть
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
