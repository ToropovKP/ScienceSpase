<section id="container__main">
  <div class="container">
    <app-toast-container />
    <div class="main">
      <!-- Заголовок -->

      <app-loading-spinner *ngIf="loadingJobs && loadingConference" message="Загрузка..." />

      <div class="d-flex justify-content-between align-items-center mb-4">
        <div *ngIf="!loadingJobs && !loadingConference">
          <app-breadcrumb-wrapper [items]="breadcrumbItems || []" [home]="homeItem"></app-breadcrumb-wrapper>
        </div>
        <button *ngIf="!loadingJobs && jobs?.length" class="btn btn-primary d-flex align-items-center"
                (click)="addJob()">
          <span>Добавить работу</span>
        </button>
      </div>

      <app-loading-spinner *ngIf="loadingJobs && !loadingConference" message="Загрузка статей..." />

      <app-empty-state 
        *ngIf="!loadingJobs && !jobs?.length"
        title="Нет добавленных статей"
        iconClass="bi bi-file-earmark-x fs-1 text-secondary">
        <div class="d-flex flex-column flex-md-row gap-2 gap-md-3 justify-content-center mt-4">
          <button class="btn btn-primary px-4" (click)="addJob()">
            Добавить работу
          </button>
        </div>
      </app-empty-state>

      <!-- Список статей -->
      <div *ngIf="!loadingJobs && jobs?.length" class="article-list">
        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
          <div class="col" *ngFor="let job of jobs">
            <div class="card h-100 shadow-sm">
              <!-- Заголовок -->
              <div class="card-header bg-primary text-white">
                <h3 class="h5 mb-0 text-truncate">{{ job.title }}</h3>
              </div>

              <!-- Тело карточки -->
              <div class="card-body">
                <div class="d-flex flex-column gap-2">
                  <div class="d-flex align-items-center gap-2">
                    <i class="bi bi-journal-text text-primary"></i>
                    <span class="conference-text text-muted">
                      {{ job.conferenceTitle }}
                    </span>
                  </div>

                  <div class="d-flex align-items-center gap-2">
                    <i class="bi bi-person-circle text-primary"></i>
                    <span class="text-break"
                          [class.text-success]="job.userId === currentUser.id"
                          [class.text-danger]="job.userId !== currentUser.id">
                      {{ job.userName }}
                    </span>
                  </div>
                </div>
              </div>

              <!-- Футер -->
              <div class="card-footer bg-transparent border-top-0">
                <button class="btn btn-outline-primary w-100"
                        (click)="openJob(job.id)">
                  <i class="bi bi-box-arrow-in-right me-2"></i>Открыть
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
