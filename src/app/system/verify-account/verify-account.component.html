<section id="container__main">
  <div class="container">
    <p-toast />
    <div class="main">

      <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
          <h2 class="h4 mb-0">
            <i class="bi bi-shield-check me-2"></i>Подтверждение аккаунта
          </h2>
        </div>
        <div class="card-body p-0">
          <div *ngIf="verified" class="alert alert-success m-0">
            <div class="d-flex align-items-center gap-3 p-4">
              <i class="bi bi-check-circle-fill fs-2"></i>
              <div>
                <h3 class="alert-heading mb-3">Успешное подтверждение!</h3>
                <p class="mb-0">Ваш аккаунт успешно активирован</p>
              </div>
            </div>
          </div>

          <div *ngIf="!verified" class="alert alert-warning m-0">
            <div class="d-flex align-items-center gap-3 p-4">
              <i class="bi bi-exclamation-triangle-fill fs-2"></i>
              <div>
                <h3 class="alert-heading mb-3">Проблема с подтверждением</h3>
                <p class="mb-3">
                  Ссылка для подтверждения устарела или недействительна
                </p>
                <div class="d-flex gap-2 flex-wrap">
                  <span *ngIf="currentUser">
                    <button class="btn btn-primary" (click)="sendRepeatLink()">
                      <i class="bi bi-send me-2"></i>Отправить новую ссылку
                    </button>
                  </span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
