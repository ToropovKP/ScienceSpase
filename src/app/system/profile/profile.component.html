<section id="container__main">
  <div class="container">
    <p-toast />
    <p-confirm-popup />
    <div *ngIf="profileUser" class="main">
      <!-- Шапка профиля -->
      <div class="card shadow-sm mb-4">
        <div class="card-header bg-primary text-white">
          <h2 class="h5 mb-0">
            <i class="bi bi-person-badge me-2"></i>Профиль пользователя
          </h2>
        </div>
        <div class="card-body">
          <div class="row align-items-center">
            <div class="col-md-6 mb-3 mb-md-0">
              <div class="text-muted">Email: {{profileUser.email}}</div>
              <div *ngIf="showButtonsToChange() && !profileUser.verified"
                   class="alert alert-danger mt-2 mb-0">
                <i class="bi bi-envelope-exclamation me-2"></i>
                Подтвердите аккаунт через письмо
                <a class="alert-link ms-2" (click)="sendRepeatLink()">Отправить повторно</a>
              </div>
            </div>

            <!-- Кнопки админа -->
            <div *ngIf="isAdmin()" class="col-md-6">
              <div class="d-flex gap-2 flex-wrap justify-content-md-end">
                <button class="btn btn-sm btn-dark"
                        *ngIf="profileUser.role == 'MEMBER'"
                        (click)="confirmRole($event)">
                  Назначить администратором
                </button>
                <button class="btn btn-sm btn-dark"
                        *ngIf="profileUser.role == 'MODERATOR'"
                        (click)="confirmRole($event)">
                  Назначить участником
                </button>
                <button class="btn btn-sm btn-danger"
                        *ngIf="profileUser.role != 'ADMIN' && profileUser.status == 'ACTIVE'"
                        (click)="confirmStatus($event)">
                  Заблокировать
                </button>
                <button class="btn btn-sm btn-success"
                        *ngIf="profileUser.role != 'ADMIN' && profileUser.status == 'BANNED'"
                        (click)="confirmStatus($event)">
                  Разблокировать
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Форма редактирования -->
      <div class="card shadow-sm">
        <div class="card-body">
          <form [formGroup]="formProfile">
            <div class="row g-3">
              <!-- Персональные данные -->
              <div class="col-md-4">
                <label class="form-label">Фамилия</label>
                <input type="text" class="form-control"
                       [readonly]="!allowToChange()"
                       formControlName="lastName"
                       [maxlength]="30">
              </div>
              <div class="col-md-4">
                <label class="form-label">Имя</label>
                <input type="text" class="form-control"
                       [readonly]="!allowToChange()"
                       formControlName="firstName"
                       [maxlength]="30">
              </div>
              <div class="col-md-4">
                <label class="form-label">Отчество</label>
                <input type="text" class="form-control"
                       [readonly]="!allowToChange()"
                       formControlName="middleName"
                       [maxlength]="30">
              </div>

              <!-- Контакты -->
              <div class="col-md-4">
                <label class="form-label">Телефон</label>
                <input type="text" class="form-control"
                       mask="+0 (000) 000-0000"
                       [readonly]="!allowToChange()"
                       formControlName="phone">
              </div>
              <div class="col-md-8">
                <label class="form-label">Организация</label>
                <input type="text" class="form-control"
                       [readonly]="!allowToChange()"
                       formControlName="organization"
                       [maxlength]="100">
              </div>

              <!-- Идентификаторы -->
              <div class="col-md-4">
                <label class="form-label">ORCID</label>
                <input type="text" class="form-control"
                       mask="0000-0000-0000-0000"
                       [readonly]="!allowToChange()"
                       formControlName="orcId">
              </div>
              <div class="col-md-4">
                <label class="form-label">РИНЦ ID</label>
                <input type="text" class="form-control"
                       mask="0000-0000"
                       [readonly]="!allowToChange()"
                       formControlName="rincId">
              </div>
              <div class="col-md-4">
                <label class="form-label">Пароль</label>
                <input type="password" class="form-control"
                       [readonly]="true"
                       formControlName="password">
              </div>

              <!-- Ученая информация -->
              <div class="col-md-4">
                <label class="form-label">Ученая степень</label>
                <input type="text" class="form-control"
                       [readonly]="!allowToChange()"
                       formControlName="academicDegree"
                       [maxlength]="30">
              </div>
              <div class="col-md-4">
                <label class="form-label">Ученое звание</label>
                <input type="text" class="form-control"
                       [readonly]="!allowToChange()"
                       formControlName="academicTitle"
                       [maxlength]="30">
              </div>
            </div>
          </form>
        </div>

        <!-- Кнопки управления -->
        <div *ngIf="showButtonsToChange()" class="card-footer">
          <div class="d-grid gap-2 d-md-flex justify-content-md-end">
            <button type="button" class="btn btn-secondary"
                    *ngIf="editProfile"
                    (click)="cancelProfile()">
              Отменить
            </button>
            <button type="button" class="btn btn-primary"
                    *ngIf="!editProfile"
                    (click)="changeProfile()">
              Изменить
            </button>
            <button type="button" class="btn btn-success"
                    *ngIf="editProfile"
                    [disabled]="formProfile.invalid"
                    (click)="saveProfile()">
              Сохранить
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
