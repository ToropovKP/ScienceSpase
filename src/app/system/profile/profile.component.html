<section id="container__main">
  <div class="container">
    <p-toast [breakpoints]="{ '768px': { width: '90%', right: '0', left: '20px' } }" preventOpenDuplicates="true" />
    <p-confirm-popup />
    <div *ngIf="profileUser" class="main">
      <!-- Шапка профиля -->
      <div class="card shadow-sm mb-4">
        <div class="card-header bg-primary text-white">
          <h2 class="h5 mb-0">
            <i class="bi bi-person-badge me-2"></i>Профиль пользователя
          </h2>
        </div>
        <div class="card-body">
          <div class="row align-items-center">
            <div class="col-md-6 mb-3 mb-md-0">
              <div class="text-muted">Email: {{profileUser.email}}</div>
              <div *ngIf="showButtonsToChange() && !profileUser.verified"
                   class="alert alert-danger mt-2 mb-0">
                <i class="bi bi-envelope-exclamation me-2"></i>
                Подтвердите аккаунт через письмо
                <a class="alert-link ms-2" (click)="sendRepeatLink()">Отправить повторно</a>
              </div>
            </div>

            <!-- Кнопки админа -->
            <div *ngIf="isAdmin()" class="col-md-6">
              <div class="d-flex gap-2 flex-wrap justify-content-md-end">
                <button class="btn btn-sm btn-dark"
                        *ngIf="profileUser.role == 'MEMBER'"
                        (click)="confirmRole($event)">
                  Назначить администратором
                </button>
                <button class="btn btn-sm btn-dark"
                        *ngIf="profileUser.role == 'MODERATOR'"
                        (click)="confirmRole($event)">
                  Назначить участником
                </button>
                <button class="btn btn-sm btn-danger"
                        *ngIf="profileUser.role != 'ADMIN' && profileUser.status == 'ACTIVE'"
                        (click)="confirmStatus($event)">
                  Заблокировать
                </button>
                <button class="btn btn-sm btn-success"
                        *ngIf="profileUser.role != 'ADMIN' && profileUser.status == 'BANNED'"
                        (click)="confirmStatus($event)">
                  Разблокировать
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Форма редактирования -->
      <div class="card shadow-sm mb-4">
        <div class="card-header bg-primary text-white">
          <h5 class="mb-0"><i class="bi bi-columns-gap me-2"></i>Основная информация</h5>
        </div>
        <div class="card-body">
          <form [formGroup]="formProfile">
            <div class="row g-3">
              <!-- Персональные данные -->
              <div class="col-md-4">
                <label class="form-label">Фамилия</label>
                <input type="text" class="form-control"
                       [readonly]="!allowToChange()"
                       formControlName="lastName"
                       [maxlength]="30">
              </div>
              <div class="col-md-4">
                <label class="form-label">Имя</label>
                <input type="text" class="form-control"
                       [readonly]="!allowToChange()"
                       formControlName="firstName"
                       [maxlength]="30">
              </div>
              <div class="col-md-4">
                <label class="form-label">Отчество</label>
                <input type="text" class="form-control"
                       [readonly]="!allowToChange()"
                       formControlName="middleName"
                       [maxlength]="30">
              </div>

              <!-- Контакты -->
              <div class="col-md-4">
                <label class="form-label">Телефон</label>
                <input type="text" class="form-control"
                       mask="+0 (000) 000-0000"
                       [readonly]="!allowToChange()"
                       formControlName="phone">
              </div>
              <div class="col-md-8">
                <label class="form-label">Организация</label>
                <input type="text" class="form-control"
                       [readonly]="!allowToChange()"
                       formControlName="organization"
                       [maxlength]="100">
              </div>

              <!-- Идентификаторы -->
              <div class="col-md-4">
                <label class="form-label">
                  ORCID
                  <i class="fas fa-question-circle hover-icon" (click)="op.show($event)"></i>
                  <p-popover #op
                             styleClass="fixed-width-popover"
                             [style]="{maxWidth: '400px', width: '100%'}">
                    <div class="popover-content">
                      <div class="popover-header">
                        <h5 class="popover-title">Что такое ORCID?</h5>
                      </div>
                      <div class="popover-body">
                        <p class="popover-text">
                          ORCID (Open Researcher and Contributor ID) — это уникальный идентификатор исследователя,
                          который позволяет установить связь между авторами и их работами.
                          Формат: 16 цифр и/или латинских букв, например, <code>0000-0000-0000-0000</code>.
                        </p>
                        <div class="text-right">
                          <a href="https://info.orcid.org/ru/%D0%BA%D0%B0%D0%BA%D0%BE%D0%B9-%D1%83-%D0%BC%D0%B5%D0%BD%D1%8F-%D0%B8%D0%B4%D0%B5%D0%BD%D1%82%D0%B8%D1%84%D0%B8%D0%BA%D0%B0%D1%82%D0%BE%D1%80/"
                             target="_blank"
                             class="popover-link">
                            Подробнее <i class="fas fa-external-link-alt ml-1"></i>
                          </a>
                        </div>
                      </div>
                    </div>
                  </p-popover>
                </label>
                <input type="text" class="form-control text-uppercase"
                       mask="SSSS-SSSS-SSSS-SSSS"
                       placeholder="0000-0000-0000-0000"
                       [patterns]="customOrcidPattern"
                       [showMaskTyped]="true"
                       [readonly]="!allowToChange()"
                       formControlName="orcId">
              </div>
              <div class="col-md-4">
                <label class="form-label">
                  РИНЦ ID (Author ID)
                  <i class="fas fa-question-circle hover-icon" (click)="opRinc.show($event)"></i>
                  <p-popover #opRinc
                             styleClass="fixed-width-popover"
                             [style]="{maxWidth: '400px', width: '100%'}">
                    <div class="popover-content">
                      <div class="popover-header">
                        <h5 class="popover-title">Что такое РИНЦ ID?</h5>
                      </div>
                      <div class="popover-body">
                        <p class="popover-text">
                          РИНЦ ID (AuthorID) — уникальный идентификатор автора в Российском индексе научного цитирования.
                          Позволяет однозначно идентифицировать исследователя и его публикации. Формат:
                          <code>0000-0000</code> (8 цифр).
                        </p>
                        <div class="text-right">
                          <a href="https://www.hse.ru/scholarly-integration/howtofindid"
                             target="_blank"
                             class="popover-link">
                            Подробнее <i class="fas fa-external-link-alt ml-1"></i>
                          </a>
                        </div>
                      </div>
                    </div>
                  </p-popover>
                </label>
                <input type="text" class="form-control"
                       mask="0000-0000"
                       placeholder="0000-0000"
                       [showMaskTyped]="true"
                       [readonly]="!allowToChange()"
                       formControlName="rincId">
              </div>
              <div class="col-md-4">
              </div>

              <!-- Ученая информация -->
              <div class="col-md-4">
                <label class="form-label">Ученая степень</label>
                <input type="text" class="form-control"
                       [readonly]="!allowToChange()"
                       formControlName="academicDegree"
                       [maxlength]="100">
              </div>
              <div class="col-md-4">
                <label class="form-label">Ученое звание</label>
                <input type="text" class="form-control"
                       [readonly]="!allowToChange()"
                       formControlName="academicTitle"
                       [maxlength]="100">
              </div>
            </div>
          </form>
        </div>

        <!-- Кнопки управления -->
        <div *ngIf="showButtonsToChange()" class="card-footer">
          <div class="d-grid gap-2 d-md-flex justify-content-md-end">
            <button type="button" class="btn btn-secondary"
                    *ngIf="editProfile"
                    (click)="cancelProfile()">
              Отменить
            </button>
            <button type="button" class="btn btn-primary"
                    *ngIf="!editProfile"
                    (click)="changeProfile()">
              Изменить
            </button>
            <button type="button" class="btn btn-success"
                    *ngIf="editProfile"
                    [disabled]="formProfile.invalid"
                    (click)="saveProfile()">
              Сохранить
            </button>
          </div>
        </div>
      </div>


      <!-- Секция безопасности -->
      <div *ngIf="showButtonsToChange()"
           class="card shadow-sm mt-4">
        <div class="card-header bg-primary text-white">
          <h5 class="mb-0"><i class="bi bi-shield-lock me-2"></i>Безопасность</h5>
        </div>
        <div class="card-body">
          <form [formGroup]="securityForm">
            <!-- Основная кнопка -->
            <div *ngIf="!editPassword">
              <button type="button"
                      class="btn btn-outline-primary"
                      (click)="initiatePasswordChange()">
                Изменить пароль
              </button>
            </div>

            <!-- Текущий пароль -->
            <div *ngIf="editPassword && !showNewPasswordFields" class="password-section">
              <div class="row g-3">
                <div class="col-12">
                  <label class="form-label">Текущий пароль</label>
                  <input type="password"
                         class="form-control"
                         formControlName="currentPassword"
                         [class.is-invalid]="securityForm.get('currentPassword')?.invalid">
                  <div class="invalid-feedback">
                    <div *ngIf="securityForm.get('currentPassword')?.hasError('required')">
                      Введите текущий пароль
                    </div>
                    <div *ngIf="securityForm.get('currentPassword')?.hasError('incorrect')">
                      Неверный пароль
                    </div>
                  </div>
                </div>

                <div class="col-12">
                  <div class="d-flex gap-2">
                    <button type="button"
                            class="btn btn-primary"
                            (click)="verifyCurrentPassword()"
                            [disabled]="securityForm.get('currentPassword')?.invalid">
                      Проверить
                    </button>
                    <button type="button"
                            class="btn btn-outline-secondary"
                            (click)="cancelPasswordChange()">
                      Отмена
                    </button>
                  </div>
                </div>
              </div>
            </div>

            <!-- Новый пароль (оставляем как было) -->
            <div *ngIf="showNewPasswordFields" class="new-password-section">
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label">Новый пароль</label>
                  <input type="password"
                         class="form-control"
                         formControlName="password"
                         [class.is-invalid]="securityForm.get('password')?.invalid">
                  <div *ngIf="securityForm.get('password')?.invalid"
                       class="invalid-feedback">
                    Минимум 8 символов
                  </div>
                </div>

                <div class="col-md-6">
                  <label class="form-label">Подтвердите пароль</label>
                  <input type="password"
                         class="form-control"
                         formControlName="confirmedPassword"
                         [class.is-invalid]="securityForm.hasError('passwordMismatch')">
                  <div *ngIf="securityForm.hasError('passwordMismatch')"
                       class="invalid-feedback">
                    Пароли не совпадают
                  </div>
                </div>

                <div class="col-12">
                  <div class="d-flex gap-2">
                    <button type="button"
                            class="btn btn-success"
                            (click)="updatePassword()"
                            [disabled]="securityForm.invalid">
                      Сохранить
                    </button>
                    <button type="button"
                            class="btn btn-outline-secondary"
                            (click)="cancelPasswordChange()">
                      Отмена
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </form>
        </div>
      </div>

    </div>
  </div>
</section>
