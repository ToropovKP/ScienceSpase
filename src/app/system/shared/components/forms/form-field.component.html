<p-iftalabel class="mb-3">
  <input 
    pInputText 
    [id]="id" 
    [type]="type"
    [formControl]="control"
    [placeholder]="placeholder"
    [autocomplete]="autocomplete"
    [attr.maxlength]="maxlength || null"
    [ngClass]="{'has-error': hasError(), 'ng-invalid ng-dirty': hasError()}"
    [fluid]="true" />
  <label [for]="id">
    {{ label }}
    <span *ngIf="required" class="text-danger">*</span>
  </label>
</p-iftalabel>
