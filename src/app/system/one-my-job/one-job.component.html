<header class="p-3 bg-dark text-white fixed-top"
  style="margin-top: 87px;background-color: #33486E!important; z-index: 9;">
  <div class="container">
    <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start">
      <ul class="nav col-12 col-lg-auto me-lg-auto mb-2 justify-content-center mb-md-0">
        <li (click)="toPage('conferences')"><a class="nav-link px-2 text-white head-text">Конференции</a></li>
        <li (click)="toPage('my-jobs')"><a class="nav-link px-2 text-white head-text">Мои статьи</a></li>
        <li (click)="toPage('all-users')" *ngIf="isSuperAdmin()"><a class="nav-link px-2 text-white head-text">Пользователи</a></li>
        <li><a href="#" class="nav-link px-2 text-white head-text">Контакты</a></li>
      </ul>
    </div>
  </div>
</header>

<!-- Сама конференция админка / обычная -->


<section id="conference">
  <div class="container">

    <div class="main">
      <div class="row d-flex align-items-center konf-pref rounded-3">
        <div class="d-inline-flex align-items-center col-8">
          <div class="conf-name-adress text-black">
            Мои статьи / {{this.currentJob.conferenceTitle}} / {{this.currentJob.title}}
          </div>
        </div>
      </div>



      <div class="row konf-information rounded-3">

        <div style="margin-top: 20px; padding: 0px;">
          <!-- Загрузка через проводник и перетаскиванием -->
          <form [formGroup]="formAddJob">
            <div class="row" style="margin-left: 0px;">
              <div class="col-12" style="padding-left: 0px; margin-bottom: 20px;">
                <label class="second-text strong text-black" for="floatingInput">Название </label>
                <input [readonly]="true" type="text" class="bg-white form-control section-text text-black" formControlName="title"
                  id="floatingInput">
              </div>
              <div class="col-12" style="padding-left: 0px; margin-bottom: 20px;">
                <label class="second-text text-black" for="floatingInput">Соавторы</label>
                <input [readonly]="true" type="text" class="bg-white form-control section-text text-black" formControlName="coauthors"
                  id="floatingInput">
              </div>
            </div>
            <div class="row" style="margin-left: 0px;">
              <div class="col-12" style="padding-left: 0px; margin-bottom: 20px;">
                <label class="second-text strong text-black" for="floatingInput">Описание </label>
                <textarea [readonly]="true" type="text" class="bg-white form-control section-area text-black" formControlName="description"
                          id="floatingInput"></textarea>
              </div>
            </div>
            <div class="row" style="margin-left: 0px;">
              <div class="col-4" style="padding-left: 0px; margin-bottom: 20px;">
                <label class="second-text text-black" for="floatingInput">Телефон </label>
                <input [readonly]="true" type="text" class="bg-white form-control section-text text-black" formControlName="phone"
                  id="floatingInput">
              </div>
              <div class="col-4" style="padding-left: 0px; margin-bottom: 20px;">
                <label class="second-text text-black" for="floatingInput">ORCID </label>
                <input [readonly]="true" type="text" class="bg-white form-control section-text text-black" formControlName="orcId"
                       id="floatingInput">
              </div>
              <div class="col-4" style="padding-left: 0px;">
                <label class="second-text text-black" for="floatingInput">РИНЦ ID </label>
                <input [readonly]="true" type="text" class="bg-white form-control section-text text-black" formControlName="rincId"
                       id="floatingInput">
              </div>
            </div>
            <div class="row" style="margin-left: 0px;">
              <div class="col-4" style="padding-left: 0px; margin-bottom: 20px;">
                <label class="second-text text-black" for="floatingInput">Организация </label>
                <input [readonly]="true" type="text" class="bg-white form-control section-text text-black" formControlName="organization"
                  id="floatingInput">
              </div>
              <div class="col-4" style="padding-left: 0px;">
                <label class="second-text text-black" for="floatingInput">Ученая степень</label>
                <input [readonly]="true" type="text" class="bg-white form-control section-text text-black" formControlName="academicDegree"
                  id="floatingInput">
              </div>
              <div class="col-4" style="padding-left: 0px;">
                <label class="second-text text-black" for="floatingInput">Ученое звание</label>
                <input [readonly]="true" type="text" class="bg-white form-control section-text text-black" formControlName="academicTitle"
                  id="floatingInput">
              </div>
            </div>
            <div class="row" style="margin-left: 0px;">
              <div class="col-4" style="padding-left: 0px; margin-bottom: 20px;">
                <label class="second-text text-black" for="floatingInput">Секция </label>
                <input [readonly]="true" type="text" class="bg-white form-control section-text text-black" formControlName="section"
                       id="floatingInput">
              </div>
            </div>
            <div class="row" style="margin-left: 0px;">
              <div class="col-12" style="padding-left: 0px; margin-bottom: 20px;">
                <label class="second-text text-black" for="floatingInput">Файлы </label>
                <div *ngFor="let file of this.currentJob.fileName" id="floatingInput" style="padding-left: 0px; margin-bottom: 20px;">
                  <a (click)="downloadFile(file)" class="bg-white form-control section-text text-black">{{ file }}</a>
                </div>
              </div>
            </div>
            <div class="row" style="margin-left: 0px;">
              <div class="col-12" style="padding-left: 0px; margin-bottom: 20px;">
                <div class="container py-3">

                  <div class="d-flex justify-content-center">
                    

                      <div class="card col-12">
                        <div class="card-header d-flex justify-content-between align-items-center p-3"
                          style="border-top: 4px solid #8C99B9;">
                          <h5 class="mb-0">Чат</h5>
                        </div>
                        <div class="card-body"  data-mdb-perfect-scrollbar="true" style="position: relative; height: 400px; overflow: auto;">

                          <div class="d-flex justify-content-start">
                            <p class="mb-1">Админ,</p><pre> </pre>
                            <p class="mb-1 text-muted">23 Jan 5:37 pm</p>
                          </div>
                          <div class="d-flex flex-row justify-content-start">
                            <div>
                              <p class="p-2 me-3 mb-3 rounded-3" style="background-color: #f5f6f7;">Dolorum quasi voluptates quas
                                amet in
                                repellendus perspiciatis fugiat</p>
                            </div>
                          </div>

                          <div class="d-flex justify-content-end">
                            <p class="mb-1 text-muted">23 Jan 6:10 pm,</p><pre> </pre>
                            <p class="mb-1">Пользак</p>
                          </div>
                          <div class="d-flex flex-row justify-content-end mb-4 pt-1">
                            <div>
                              

                                <p class="p-2 ms-3 mb-3 text-white rounded-3" style="background-color: #8C99B9;">
                                  Lorem ipsum dolor
                                  </p>
                            </div>
                          </div>
                          

                        </div>
                        <div class="card-footer text-muted d-flex justify-content-start align-items-center p-3">
                          <div class="input-group mb-0">
                            <input type="text" class="form-control" placeholder="Type message"
                              aria-label="Recipient's username" aria-describedby="button-addon2" />
                            <button data-mdb-button-init data-mdb-ripple-init class="btn btn-dark" type="button" id="button-addon2">
                              Отправить
                            </button>
                          </div>
                        </div>
                      </div>

                  </div>

                </div>
              </div>
            </div>
          </form>

        </div>

        <div class="row align-items-center" style="margin-bottom: 20px; margin-top: 10px;">
          <div class="col-4 conf-info-text text-black">

          </div>
          <div class="col-4 conf-info-text text-black text-center">
            <button type="button" class="form-control rounded-3 btn btn-pref text-white" *ngIf="this.isUserJob()" (click)="deleteJob()">Удалить</button>
          </div>
          <div class="col-4 conf-info-text text-black text-end">

          </div>
        </div>


        <!--<div class="konf-description text-black">Описание: {{conf.description}}</div>-->
      </div>
    </div>
  </div>
</section>
