<section id="container__main">
  <div class="container">
    <p-toast />
    <div class="main">
      <form [formGroup]="formCreateConference">
        <!-- Шапка -->
        <div class="header-container mb-4">
          <div class="d-flex align-items-center justify-content-between">
            <div class="title-flex-wrapper">
              <span class="status-badge bg-secondary">
                {{ currentConference ? 'Редактирование' : 'Создание' }}
              </span>
              <h1 class="conference-title">
                {{ formCreateConference.get('confName')?.value || 'Новая конференция' }}
              </h1>

            </div>

            <!-- Блок администратора -->
            <div *ngIf="isAdmin()" class="d-flex align-items-center gap-3">
              <div class="dropdown">
                <button class="btn btn-outline-secondary dropdown-toggle"
                        type="button"
                        data-bs-toggle="dropdown"
                        data-bs-auto-close="outside">
                  <i class="bi bi-gear me-2"></i>
                  Администраторы
                </button>
                <ul class="dropdown-menu dropdown-menu-end p-3">
                  <li *ngFor="let user of admins">
                    <div class="form-check">
                      <input class="form-check-input"
                             type="checkbox"
                             [formControlName]="'admin' + user.id"
                             [id]="'admin' + user.id"
                             (change)="updateAdmin()">
                      <label class="form-check-label" [for]="'admin' + user.id">
                        {{ user.firstName }} {{ user.lastName }}
                      </label>
                    </div>
                  </li>
                </ul>
              </div>
            </div>
          </div>
        </div>

        <!-- Основные поля -->
        <div class="card shadow-sm mb-4">
          <div class="card-header bg-primary text-white">
            <h5 class="mb-0"><i class="bi bi-info-circle me-2"></i>Основные параметры</h5>
          </div>
          <div class="card-body">
            <div class="row g-4">
              <!-- Название -->
              <div class="col-md-8">
                <label class="form-label fs-5">
                  Название конференции
                  <span class="text-danger">*</span>
                </label>
                <input type="text"
                       class="form-control"
                       formControlName="confName"
                       [class.is-invalid]="formCreateConference.get('confName')?.invalid"
                       [readonly]="!isMasterModeratorOfThisConference()"
                       [maxlength]="100">
              </div>

              <!-- Статус -->
              <div class="col-md-4">
                <label class="form-label fs-5">Статус <span class="text-danger">*</span></label>
                <select class="form-select"
                        formControlName="confStatus"
                        [attr.disabled]="!isMasterModeratorOfThisConference() ? true : null"
                        (change)="updateStatus($event)">
                  <option [ngValue]="undefined">Выберите статус</option>
                  <option *ngFor="let status of conferenceStatusList">{{ status }}</option>
                </select>
              </div>

              <!-- Организация -->
              <div class="col-md-4">
                <label class="form-label fs-5">Организация <span class="text-danger">*</span></label>
                <input type="text"
                       class="form-control"
                       formControlName="organization"
                       [readonly]="!isMasterModeratorOfThisConference()"
                       [maxlength]="100">
              </div>

              <!-- Даты -->
              <div class="col-md-4">
                <label class="form-label fs-5">Дата начала <span class="text-danger">*</span></label>
                <input type="date"
                       class="form-control"
                       formControlName="date_start"
                       [readonly]="!isMasterModeratorOfThisConference()">
              </div>

              <div class="col-md-4">
                <label class="form-label fs-5">Дата завершения <span class="text-danger">*</span></label>
                <input type="date"
                       class="form-control"
                       formControlName="date_end"
                       [readonly]="!isMasterModeratorOfThisConference()">
              </div>

              <!-- Описание -->
              <div class="col-12">
                <label class="form-label fs-5">Описание <span class="text-danger">*</span></label>
                <textarea class="form-control"
                          rows="4"
                          formControlName="description"
                          [readonly]="!isMasterModeratorOfThisConference()"
                          [maxlength]="1000"></textarea>
              </div>
            </div>
          </div>
        </div>

        <!-- Секции -->
        <div class="card shadow-sm mb-4">
          <div class="card-header bg-primary text-white">
            <h5 class="mb-0"><i class="bi bi-columns-gap me-2"></i>Секции</h5>
          </div>
          <div class="card-body">
            <div *ngIf="loadingSections" class="text-center py-4">
              <div class="spinner-border" role="status"></div>
            </div>

            <div *ngIf="!loadingSections" formArrayName="sections">
              <div *ngFor="let section of sections.controls; let i = index" [formGroupName]="i" class="mb-3">
                <div class="row g-2 align-items-center">
                  <div class="col-md-5">
                    <input type="text"
                           class="form-control"
                           formControlName="title"
                           placeholder="Название секции"
                           [readonly]="!isLeaderSection(i)">
                  </div>

                  <div class="col-md-3">
                    <div *ngIf="!isMasterModeratorOfThisConference()" >
                      <button class="btn btn-outline-secondary w-100 text-start text-truncate"
                              type="button"
                              disabled>
                        {{ countLeadSecArray(i) !== 0 ? getStringLeadSecArray(i) : 'Не назначен' }}
                      </button>
                    </div>
                    <div *ngIf="isMasterModeratorOfThisConference()" class="dropdown">
                      <button class="btn btn-outline-secondary w-100 text-start text-truncate"
                              type="button"
                              data-bs-toggle="dropdown"
                              data-bs-auto-close="outside"
                              [disabled]="isDisabledSection(i)"
                              [id]="'dropdownMenuButtonLeaders' + i">
                        {{ getStringLeadSecArray(i) || 'Выберите руководителей' }}
                      </button>
                      <ul formArrayName="leaders"
                          class="dropdown-menu p-3"
                          [attr.aria-labelledby]="'dropdownMenuButtonLeaders' + i">
                        <li *ngFor="let user of leadSecArray(i).controls; let j = index" [formGroupName]="j">
                          <div class="form-check">
                            <input class="form-check-input"
                                   type="checkbox"
                                   formControlName="selected"
                                   *ngIf="isMasterModeratorOfThisConference() ? this.currentUser.id != user.get('id')?.value : null"
                                   [id]="'leader' + i + j">
                            <label class="form-check-label" [for]="'leader' + i + j">
                              {{ user.get('name')?.value }}
                            </label>
                          </div>
                        </li>
                      </ul>
                    </div>
                  </div>

                  <div class="col-md-3">
                    <div *ngIf="!isMasterModeratorOfThisConference()" >
                      <button class="btn btn-outline-secondary w-100 text-start text-truncate"
                              type="button"
                              disabled>
                        {{ countReviewSecArray(i) !== 0 ? getStringReviewSecArray(i) : 'Не назначен' }}
                      </button>
                    </div>
                    <div *ngIf="isMasterModeratorOfThisConference()" class="dropdown">
                      <button class="btn btn-outline-secondary w-100 text-start text-truncate"
                              type="button"
                              data-bs-toggle="dropdown"
                              data-bs-auto-close="outside"
                              [disabled]="isDisabledSection(i)"
                              [id]="'dropdownMenuButtonLeaders' + i">
                        {{ getStringReviewSecArray(i) || 'Выберите рецензентов' }}
                      </button>
                      <ul formArrayName="reviewers"
                          class="dropdown-menu p-3"
                          [attr.aria-labelledby]="'dropdownMenuButtonLeaders' + i">
                        <li *ngFor="let user of reviewSecArray(i).controls; let j = index" [formGroupName]="j">
                          <div class="form-check">
                            <input class="form-check-input"
                                   type="checkbox"
                                   formControlName="selected"
                                   [id]="'reviewer' + i + j">
                            <label class="form-check-label" [for]="'reviewer' + i + j">
                              {{ user.get('name')?.value }}
                            </label>
                          </div>
                        </li>
                      </ul>
                    </div>
                  </div>

                  <!-- Кнопки управления -->
                  <div class="col-md-1">
                    <div class="d-flex gap-2">
                      <button *ngIf="!section.get('title')?.disabled"
                              class="btn btn-success"
                              [disabled]="section.get('title')?.value === ''"
                              (click)="disableSection(i)">
                        <i class="bi bi-check-lg"></i>
                      </button>

                      <button *ngIf="section.get('title')?.disabled"
                              class="btn btn-outline-secondary"
                              [disabled]="!isLeaderSection(i) ? true : null"
                              (click)="enableSection(i)">
                        <i class="bi bi-pencil"></i>
                      </button>

                      <button *ngIf="section.get('title')?.disabled"
                              class="btn btn-outline-danger"
                              [disabled]="!isMasterModeratorOfThisConference() ? true : null"
                              (click)="removeSection(i)">
                        <i class="bi bi-trash"></i>
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>

          </div>
        </div>

        <!-- Критерии оценивания -->
        <div class="card shadow-sm mb-4">
          <div class="card-header bg-primary text-white">
            <h5 class="mb-0"><i class="bi bi-tags me-2"></i>Критерии оценивания</h5>
          </div>
          <div class="card-body">
            <div *ngIf="loadingTags" class="text-center py-4">
              <div class="spinner-border" role="status"></div>
            </div>

            <div *ngIf="!loadingTags" formArrayName="tags">
              <div *ngFor="let tag of tags.controls; let i = index" [formGroupName]="i" class="mb-3">
                <div class="row g-2 align-items-center">
                  <div class="col-md-10">
                    <input type="text"
                           class="form-control"
                           formControlName="name"
                           placeholder="Новый критерий"
                           [readonly]="!isMasterModeratorOfThisConference()">
                  </div>

                  <div class="col-md-2">
                    <div class="d-flex gap-2">
                      <button *ngIf="!tag.get('name')?.disabled"
                              class="btn btn-success"
                              [disabled]="tag.get('name')?.value === ''"
                              (click)="disableTag(i)">
                        <i class="bi bi-check-lg"></i>
                      </button>

                      <button *ngIf="tag.get('name')?.disabled"
                              class="btn btn-outline-secondary"
                              [disabled]="!isMasterModeratorOfThisConference() ? true : null"
                              (click)="enableTag(i)">
                        <i class="bi bi-pencil"></i>
                      </button>

                      <button *ngIf="tag.get('name')?.disabled"
                              class="btn btn-outline-danger"
                              [disabled]="!isMasterModeratorOfThisConference() ? true : null"
                              (click)="removeTag(i)">
                        <i class="bi bi-trash"></i>
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="text-center mt-4">
          <button type="button"
                  class="btn btn-primary px-5"
                  [disabled]="formCreateConference.invalid"
                  (click)="currentConferenceId ? updateConference() : createConference()">
            <i class="bi bi-save me-2"></i>
            {{ currentConferenceId ? 'Сохранить изменения' : 'Создать конференцию' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</section>
