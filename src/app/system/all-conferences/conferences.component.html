<section id="container__main">
  <div class="container">
    <p-toast />
    <div class="main">
      <!-- Заголовок и кнопка создания -->
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="h3 text-black mb-0">
          Конференции
        </h2>
        <button *ngIf="isAdmin()"
                class="btn btn-primary rounded-circle"
                (click)="createConference()">
          <i class="bi bi-plus-lg fs-5"></i>
        </button>
      </div>

      <div *ngIf="loadingConference" class="text-center">
        <div class="spinner-border" role="status">
          <span class="visually-hidden">Загрузка...</span>
        </div>
      </div>

      <!-- Список конференций -->
      <div *ngIf="!loadingConference && !conferences?.length" class="text-center py-5 bg-light rounded-3">
        <div class="h4 text-muted mb-3">Нет доступных конференций</div>
        <i class="bi bi-calendar-x fs-1 text-secondary"></i>
      </div>

      <div *ngIf="!loadingConference && conferences?.length" class="conf-list">
        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
          <div class="col" *ngFor="let conf of conferences">
            <div class="card h-100 shadow-sm conf-item">
              <!-- Заголовок карточки -->
              <div class="card-header bg-primary text-white">
                <h3 class="h5 mb-0 text-truncate">{{ conf.title }}</h3>
              </div>

              <!-- Тело карточки -->
              <div class="card-body">
                <div class="d-flex flex-column gap-2">
                  <div class="d-flex align-items-center gap-2">
                    <i class="bi bi-building text-primary"></i>
                    <span class="organization-text text-muted">
                      {{ conf.organization }}
                    </span>
                  </div>

                  <div class="d-flex align-items-center gap-2">
                    <i class="bi bi-calendar-range text-primary"></i>
                    <span>
                      {{ DateService.formatDate(conf.startDate) }} -
                      {{ DateService.formatDate(conf.endDate) }}
                    </span>
                  </div>

                  <div class="d-flex align-items-center gap-2">
                    <i class="bi bi-circle-fill"
                       [ngClass]="{
                         'text-success': conf.status === 'ACTIVE',
                         'text-danger': conf.status === 'CLOSED',
                         'text-warning': conf.status === 'ON_HOLD'
                       }"></i>
                    <span>{{ conferenceStatusMap[conf.status] }}</span>
                  </div>
                </div>
              </div>

              <!-- Футер карточки -->
              <div class="card-footer bg-transparent border-top-0">
                <button class="btn btn-outline-primary w-100"
                        (click)="openConf(conf.id)">
                  <i class="bi bi-box-arrow-in-right me-2"></i>Подробнее
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
