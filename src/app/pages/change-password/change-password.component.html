<section class="auth">
  <div class="auth__col auth__col--gutter" aria-hidden="true"></div>

  <div class="auth__col auth__col--main">
    <div class="auth__wrapper">
      <p-toast />

      <header class="auth__header">
        <h1 class="auth__title">Смена пароля</h1>
      </header>

      <form
        [formGroup]="securityForm"
        (ngSubmit)="handlePasswordChange()"
        class="auth__form auth-change-password__form"
      >
        <div class="auth__password-field">
          <span class="auth__field-label auth__field-label--block">Текущий пароль</span>
          <app-password-field
            id="auth-chg-cur"
            inputId="auth-chg-cur-input"
            label="Текущий пароль"
            placeholder="Введите пароль"
            [hideLabel]="true"
            [required]="true"
            [control]="currentPasswordControl"
            [feedback]="false"
            [toggleMask]="true"
            [highlightError]="!!(currentPasswordControl.errors?.['incorrect'] && currentPasswordControl.touched)"
          />
          <p *ngIf="currentPasswordControl.invalid && currentPasswordControl.touched" class="auth__field-error">
            <span *ngIf="currentPasswordControl.hasError('required')">Введите текущий пароль</span>
            <span *ngIf="currentPasswordControl.hasError('incorrect')">Неверный пароль</span>
          </p>
        </div>

        <app-password-with-confirm-form
          variant="account"
          idPrefix="auth-chg"
          [passwordControl]="passwordControl"
          [confirmPasswordControl]="confirmedPasswordControl"
          [hostForm]="securityForm"
        />

        <p-button
          styleClass="auth-btn auth-btn--primary"
          class="auth__login-button w-100"
          label="Изменить пароль"
          type="submit"
          [fluid]="true"
          [loading]="isUpdating"
          [disabled]="securityForm.invalid || isUpdating"
        />

        <p-button
          styleClass="auth-btn auth-btn--outline"
          class="auth__login-button w-100 mt-2"
          label="Назад в профиль"
          type="button"
          [fluid]="true"
          routerLink="/profile"
        />
      </form>
    </div>
  </div>

  <div class="auth__col auth__col--gutter" aria-hidden="true"></div>
</section>
