<section class="auth">
  <div class="auth__col auth__col--gutter" aria-hidden="true"></div>

  <div class="auth__col auth__col--main">
    <div class="auth__wrapper">
      <p-toast />

      <header class="auth__header">
        <h1 class="auth__title">Восстановление пароля</h1>
        <p *ngIf="sessionId" class="auth__subtitle auth-set-password__subtitle">
          Введите новый пароль для вашего аккаунта
        </p>
      </header>

      <p *ngIf="!sessionId" class="auth__instruction">
        Ссылка недействительна. Перейдите в
        <a routerLink="/auth/recover" class="auth__link">восстановление пароля</a>
        и пройдите проверку кода.
      </p>

      <div *ngIf="sessionId" [formGroup]="form" class="auth__form auth-set-password__form">
        <app-password-with-confirm-form
          variant="account"
          idPrefix="auth-set"
          [passwordControl]="passwordControl"
          [confirmPasswordControl]="confirmedPasswordControl"
          [hostForm]="form"
          [hintTextOverride]="passwordHintRecovery"
          [mismatchText]="passwordMismatchRecovery"
        />

        <p-button
          styleClass="auth-btn auth-btn--primary"
          class="auth__login-button w-100 auth-set-password__submit"
          label="Сохранить пароль"
          type="button"
          [fluid]="true"
          [loading]="loading"
          [disabled]="form.invalid"
          (click)="submit()"
        />

        <p-button
          styleClass="auth-btn auth-btn--outline"
          class="auth__login-button w-100 auth-set-password__btn-second"
          label="На страницу входа"
          type="button"
          [fluid]="true"
          routerLink="/auth"
        />
      </div>
    </div>
  </div>

  <div class="auth__col auth__col--gutter" aria-hidden="true"></div>
</section>
