<section id="container__main">
  <div class="container">
    <app-toast-container />
    <div class="main">

      <app-loading-spinner *ngIf="loadingConference" message="Загрузка конференции..." />

      <div *ngIf="!loadingConference">
        <app-breadcrumb-wrapper [items]="breadcrumbItems || []" [home]="homeItem"></app-breadcrumb-wrapper>
      </div>

      <app-conference-view-header
        *ngIf="!loadingConference"
        [title]="currentConference.title"
        [status]="currentConference.status"
        [statusLabel]="conferenceStatusMap[currentConference.status]"
        [showAddJob]="isUserAuthorized() && !isAdmin() && currentConference.status == 'ACTIVE'"
        [showMyWorks]="
          isUserAuthorized() && !isAdmin() && currentConference.status == 'ACTIVE' && currentUserJobId != null
        "
        [showEditConference]="isUserAuthorized() && isModeratorOfThisConference()"
        [isModeratorOfConference]="isModeratorOfThisConference()"
        (addJob)="addJob()"
        (myWorks)="openJob()"
        (editConference)="editConference()"
      />

      <div *ngIf="!loadingConference">
        <app-conference-summary-cards
          [organization]="currentConference.organization"
          [startDate]="currentConference.startDate"
          [endDate]="currentConference.endDate"
          [countUsers]="countUsers"
          [showParticipantsColumn]="isModeratorOfThisConference() || isReviewer()"
          [showParticipantsCount]="isModeratorOfThisConference()"
          [showParticipantsLink]="isModeratorOfThisConference() || isReviewer()"
          (participantsClick)="checkUsers()"
        />

        <app-conference-sections-list [sections]="sections" />

        <app-conference-description-card [description]="currentConference.description" />
      </div>
    </div>
  </div>
</section>
