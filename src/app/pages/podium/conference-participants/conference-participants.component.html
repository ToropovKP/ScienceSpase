<section id="container__main">
  <div class="container">
    <app-toast-container />
    <div class="main">
      <app-loading-spinner *ngIf="loadingConference" message="Загрузка участников..." />

      <div *ngIf="!loadingConference">
        <app-breadcrumb-wrapper [items]="breadcrumbItems || []" [home]="homeItem"></app-breadcrumb-wrapper>
      </div>

      <app-conference-jobs-header
        *ngIf="!loadingConference"
        [title]="currentConference.title"
        [status]="currentConference.status"
        [statusLabel]="conferenceStatusMap[currentConference.status]"
      />

      <app-conference-summary-cards
        *ngIf="!loadingConference"
        [organization]="currentConference.organization"
        [startDate]="currentConference.startDate"
        [endDate]="currentConference.endDate"
        [countUsers]="countUsers"
        [countUsersWithJob]="countUsersWithJob"
        [showParticipantsColumn]="true"
        [showParticipantsCount]="true"
        [showParticipantsLink]="false"
      />

      <div *ngIf="!loadingConference" class="card shadow-sm">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="h5 mb-0">Участники конференции</h2>
            <span class="text-muted" *ngIf="!loadingParticipants">{{ participants.length }}</span>
          </div>

          <app-loading-spinner *ngIf="loadingParticipants" message="Загрузка списка..." />

          <div *ngIf="!loadingParticipants && participants.length === 0" class="text-muted">
            Список участников пока пуст.
          </div>

          <div *ngIf="!loadingParticipants && participants.length > 0" class="table-responsive">
            <table class="table align-middle mb-0">
              <thead>
                <tr>
                  <th>Участник</th>
                  <th>Статус</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let participant of participants">
                  <td>{{ participantName(participant) }}</td>
                  <td>
                    <span
                      class="badge"
                      [ngClass]="participant.hasSubmittedJob ? 'text-bg-success' : 'text-bg-secondary'"
                    >
                      {{ participant.hasSubmittedJob ? 'Есть работа' : 'Без работы' }}
                    </span>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
