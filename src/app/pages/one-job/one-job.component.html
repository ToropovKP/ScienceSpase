<section id="container__main">
  <div class="container">
    <app-toast-container />
    <p-confirm-dialog key="confirmPopup"/>
    <p-confirm-popup key="confirmDialog"/>
    <div class="main">

      <app-loading-spinner *ngIf="loadingJob" message="Загрузка работы..." />

      <div *ngIf="!loadingJob">
        <app-breadcrumb-wrapper [items]="breadcrumbItems || []" [home]="homeItem"></app-breadcrumb-wrapper>
      </div>

      <app-job-view-header
        *ngIf="!loadingJob"
        [title]="currentJob.title"
        [isOwner]="isUserJob()"
        [allowEdit]="allowEdit"
        (edit)="editJob()"
        (deleteClick)="confirmDelete($event)"
      />

      <!-- Основной контент -->
      <div *ngIf="!loadingJob" class="content-wrapper">
        <div *ngIf="loadingConference" class="text-center">
          <app-loading-spinner size="sm" />
        </div>

        <app-job-conference-summary
          *ngIf="!loadingConference"
          [currentConference]="currentConference"
          [jobUser]="jobUser"
          [showAuthorColumn]="!isReviewer()"
        />

        <app-job-abstract-card [description]="currentJob.description" />

        <app-job-coauthors-list
          *ngIf="!isReviewer()"
          [coAuthors]="currentJob.coAuthors"
        />

        <app-job-readonly-details
          *ngIf="!isReviewer()"
          [formJob]="formJob"
          [customOrcidPattern]="customOrcidPattern"
          [files]="currentJob.files"
          (fileDownload)="downloadFile($event)"
        />

        <app-job-review-panel
          *ngIf="isReviewer()"
          [loadingConference]="loadingConference"
          [tags]="currentConference.tags"
          [formReview]="formReview"
          [existReviewByCurrentUser]="existReviewByCurrentUser"
          [reviewByCurrentUser]="reviewByCurrentUser"
          [reviewsMarks]="reviewsMarks"
          (markChange)="updateMark($event.tag, $event.mark)"
          (saveReview)="saveReview()"
        />

        <app-job-chat
          *ngIf="!isReviewer() && allowEdit"
          [jobId]="currentJobId"
          [currentUser]="currentUser"
        />

      </div>
    </div>
  </div>
</section>
