<section id="container__main">
  <div class="container">
    <app-toast-container />
    <p-confirm-dialog key="confirmPopup"/>
    <p-confirm-popup key="confirmDialog"/>
    <div class="main">

      <app-loading-spinner *ngIf="loadingJob" message="Загрузка..." />

      <div *ngIf="!loadingJob">
        <app-breadcrumb-wrapper [items]="breadcrumbItems || []" [home]="homeItem"></app-breadcrumb-wrapper>
      </div>

      <div *ngIf="!loadingJob && !loadingConference">

        <!-- Форма добавления работы -->
        <div  class="card shadow-sm mb-4">
          <div class="card-header bg-primary text-white">
            <h5 class="mb-0"><i class="bi bi-file-earmark-plus me-2"></i>Добавление работы</h5>
          </div>
          <div class="card-body">
            <form [formGroup]="formJob" class="row g-3">

              <app-job-context-selector
                [formJob]="formJob"
                [conferences]="conferences"
                [sections]="sections"
              />

              <!-- Секция общей информации -->
              <div class="col-md-6">
                <label class="form-label">Название работы <span class="text-danger">*</span></label>
                <input type="text" class="form-control" formControlName="title" required [maxlength]="255">
              </div>

              <div class="col-12">
                <label class="form-label">Аннотация <span class="text-danger">*</span></label>
                <textarea class="form-control" rows="3" formControlName="description" required
                          [maxlength]="2000"></textarea>
              </div>

              <app-co-authors-form-array [authors]="authors" />

              <app-job-contact-info-form
                [formJob]="formJob"
                [customOrcidPattern]="customOrcidPattern"
              />

              <app-job-files-manager
                [formJob]="formJob"
                [currentJob]="currentJob"
                [uploadedFilesMetadata]="uploadedFilesMetadata"
                [needToRemoveFilesMetadata]="needToRemoveFilesMetadata"
                (uploadingFilesChange)="onUploadingFilesChange($event)"
              />

              <div class="col-12 mb-2" *ngIf="!isEditMode">
                <div class="form-check d-flex align-items-center gap-2">
                  <input
                    class="form-check-input border border-secondary mt-0"
                    type="checkbox"
                    id="jobPersonalDataConsent"
                    formControlName="personalDataConsent">
                  <label class="form-check-label mb-0" for="jobPersonalDataConsent">
                    Я ознакомился и согласен с
                    <a
                      href="https://www.nntu.ru/frontend/web/ngtu/files/universitet/documents/local_norm_akty/politika_obrabotka_pers_dannyh.pdf"
                      target="_blank"
                      rel="noopener noreferrer">
                      Политикой в отношении обработки персональных данных
                    </a>
                  </label>
                </div>
              </div>

              <!-- Кнопки -->
              <div class="col-12 d-flex justify-content-end gap-2">
                <button type="submit"
                        class="btn btn-primary"
                        [disabled]="formJob.invalid || savingJob || currentJob?.files?.length === 0"
                        (click)="saveJob()">
                  <span class="d-inline-flex align-items-center gap-2">
                    <app-loading-spinner
                      *ngIf="savingJob || uploadingFiles"
                      size="sm"
                      message="" />
                    <ng-container *ngIf="!savingJob && !uploadingFiles">
                      Сохранить работу
                    </ng-container>
                    <ng-container *ngIf="savingJob">
                      Сохранение...
                    </ng-container>
                    <ng-container *ngIf="uploadingFiles">
                      Отправка...
                    </ng-container>
                  </span>
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
