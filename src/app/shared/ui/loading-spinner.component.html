<div class="text-center">
  <div class="spinner-border" [ngClass]="{
    'spinner-border-sm': size === 'sm',
    'spinner-border-lg': size === 'lg'
  }" role="status">
    <span class="visually-hidden">{{ message }}</span>
  </div>
  <div *ngIf="message" class="mt-2 text-muted">{{ message }}</div>
</div>
