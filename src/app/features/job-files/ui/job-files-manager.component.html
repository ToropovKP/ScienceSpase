<div [formGroup]="formJob" class="w-100">
  <div *ngIf="currentJob && currentJob.files.length > 0" class="mb-3">
    <label class="form-label">Файлы</label>
    <div class="list-group">
      <a *ngFor="let file of currentJob.files"
         (click)="downloadFile(file.uuid)"
         class="list-group-item list-group-item-action d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center">
        <div class="d-flex align-items-center flex-grow-1">
          <i class="bi bi-file-earmark me-2"></i>
          <span>{{ file.originalName }}</span>
        </div>
        <small class="text-muted file-date mt-2 mt-md-0 me-3">Добавлено: {{ file.uploadTime | date:'dd.MM.yyyy HH:mm' }}</small>
        <i class="bi bi-x text-danger"
           (click)="confirmDeleteFile($event, file.uuid); $event.stopPropagation()"></i>
      </a>
    </div>
  </div>

  <div>
    <label class="form-label">Прикрепить файлы <span class="text-danger">*</span></label>
    <input type="file"
           class="form-control"
           formControlName="files"
           accept=".docx,.pdf"
           multiple
           (change)="onSelectedFiles($event)"
           (drop)="onDropFiles($event)"
           (dragover)="onDragOver($event)"
           [ngClass]="{'has-error': formJob.get('files')?.invalid && formJob.get('files')?.touched}">
    <div class="form-text">Допустимые форматы: DOCX, PDF</div>
  </div>
</div>
