<!-- Явный formGroup + ров без col+row на одном узле — корректная сетка Bootstrap -->
<div [formGroup]="formJob" class="w-100">
  <div class="row g-2">
    <div class="col-md-4">
      <label class="form-label">Конференция <span class="text-danger">*</span></label>
      <select class="form-control form-control-conference" formControlName="conference" [compareWith]="compareConference" [disabled]="loading">
        <option [ngValue]="undefined">{{ loading ? 'Загрузка…' : 'Выберите' }}</option>
        <option *ngFor="let conference of conferences" [ngValue]="conference">{{ getShortConferenceTitle(conference) }}</option>
      </select>
    </div>
  </div>
  <div class="row g-2">
    <div class="col-md-4">
      <label class="form-label">Секция <span class="text-danger">*</span></label>
      <select class="form-control form-control-section" formControlName="section" [compareWith]="compareSection" [disabled]="loading || sections.length === 0">
        <option [ngValue]="undefined">{{ loading ? 'Загрузка…' : 'Выберите' }}</option>
        <option *ngFor="let section of sections" [ngValue]="section">{{ section.title }}</option>
      </select>
      <div *ngIf="loading" class="form-text">Загрузка списка…</div>
    </div>
  </div>
</div>
