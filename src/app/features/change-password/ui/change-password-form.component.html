<div class="bg-white rounded-lg shadow-sm mt-4 border border-gray-200">
  <div class="bg-accent text-text-primary-color rounded-t-lg px-6 py-4">
    <h5 class="text-lg font-semibold mb-0 flex items-center">
      <i class="bi bi-shield-lock mr-2"></i>Безопасность
    </h5>
  </div>
  <div class="p-6">
    <form [formGroup]="securityForm" (ngSubmit)="handlePasswordChange()">
      <div class="mb-4 relative">
        <label for="currentPassword" class="block text-sm font-medium text-h1-accent mb-1">Текущий пароль</label>
        <input [type]="showCurrentPassword ? 'text' : 'password'"
               id="currentPassword"
               class="w-full px-4 py-2 pr-10 border rounded-lg bg-bg-card text-gray-700 focus:outline-none focus:ring-0 transition-colors"
               [class.border-red-500]="securityForm.get('currentPassword')?.invalid && securityForm.get('currentPassword')?.touched"
               [class.border-accent]="!securityForm.get('currentPassword')?.invalid || !securityForm.get('currentPassword')?.touched"
               formControlName="currentPassword">
        <i class="bi bi-eye{{ showCurrentPassword ? '-slash' : '' }} absolute right-3 top-9 cursor-pointer text-accent hover:text-accent-hover transition-colors"
           (click)="showCurrentPassword = !showCurrentPassword"></i>
        <div *ngIf="securityForm.get('currentPassword')?.invalid && securityForm.get('currentPassword')?.touched" class="text-red-500 text-xs mt-1">
          <div *ngIf="securityForm.get('currentPassword')?.hasError('required')">
            Введите текущий пароль
          </div>
          <div *ngIf="securityForm.get('currentPassword')?.hasError('incorrect')">
            Неверный пароль
          </div>
        </div>
      </div>

      <div class="mb-4 relative">
        <label for="newPassword" class="block text-sm font-medium text-h1-accent mb-1 flex items-center">
          Новый пароль
          <i class="bi bi-info-circle ml-2 text-accent cursor-pointer hover:text-accent-hover transition-colors"
             (click)="passwordRulesPopover.show($event)"></i>
          <p-popover #passwordRulesPopover
                     styleClass="password-rules-popover"
                     [style]="{maxWidth: '400px'}">
            <div class="popover-content">
              <div class="popover-header">
                <h5 class="popover-title">Требования к паролю</h5>
              </div>
              <div class="popover-body">
                <ul class="list-none">
                  <li class="mb-2"><i class="bi bi-check-circle-fill text-green-500 mr-2"></i>Минимум 8 символов</li>
                  <li class="mb-2"><i class="bi bi-check-circle-fill text-green-500 mr-2"></i>Хотя бы одна цифра</li>
                  <li class="mb-2"><i class="bi bi-check-circle-fill text-green-500 mr-2"></i>Хотя бы одна заглавная буква</li>
                  <li><i class="bi bi-check-circle-fill text-green-500 mr-2"></i>Спецсимволы (!&#64;#$%^&amp;*)</li>
                </ul>
              </div>
            </div>
          </p-popover>
        </label>
        <input [type]="showNewPassword ? 'text' : 'password'"
               id="newPassword"
               class="w-full px-4 py-2 pr-10 border rounded-lg bg-bg-card text-gray-700 focus:outline-none focus:ring-0 transition-colors"
               [class.border-red-500]="securityForm.get('password')?.invalid && securityForm.get('password')?.touched"
               [class.border-accent]="!securityForm.get('password')?.invalid || !securityForm.get('password')?.touched"
               formControlName="password"
               (input)="checkPasswordStrength()">
        <i class="bi bi-eye{{ showNewPassword ? '-slash' : '' }} absolute right-3 top-9 cursor-pointer text-accent hover:text-accent-hover transition-colors"
           (click)="showNewPassword = !showNewPassword"></i>
        <div *ngIf="securityForm.get('password')?.value && securityForm.get('password')?.valid"
             class="mt-2">
          <div class="h-1 bg-gray-200 rounded overflow-hidden">
            <div class="h-full transition-all duration-500"
                 [ngClass]="getPasswordStrengthClass()"
                 [style.width.%]="getPasswordStrength()">
            </div>
          </div>
          <small class="text-text-secondary-color text-xs mt-1 block">Надежность: {{ getPasswordStrengthText() }}</small>
        </div>
        <div *ngIf="securityForm.get('password')?.invalid && securityForm.get('password')?.touched"
             class="text-red-500 text-xs mt-1">
          Пароль не соответствует требованиям
        </div>
      </div>

      <div class="mb-6 relative">
        <label for="confirmPassword" class="block text-sm font-medium text-h1-accent mb-1">Подтвердите пароль</label>
        <input [type]="showConfirmPassword ? 'text' : 'password'"
               id="confirmPassword"
               class="w-full px-4 py-2 pr-10 border rounded-lg bg-bg-card text-gray-700 focus:outline-none focus:ring-0 transition-colors"
               [class.border-red-500]="securityForm.hasError('passwordMismatch') && securityForm.get('confirmedPassword')?.touched"
               [class.border-accent]="!securityForm.hasError('passwordMismatch') || !securityForm.get('confirmedPassword')?.touched"
               formControlName="confirmedPassword">
        <i class="bi bi-eye{{ showConfirmPassword ? '-slash' : '' }} absolute right-3 top-9 cursor-pointer text-accent hover:text-accent-hover transition-colors"
           (click)="showConfirmPassword = !showConfirmPassword"></i>
        <div *ngIf="securityForm.hasError('passwordMismatch') && securityForm.get('confirmedPassword')?.touched"
             class="text-red-500 text-xs mt-1">
          Пароли не совпадают
        </div>
      </div>

      <div class="flex gap-2">
        <button type="submit"
                class="flex-1 px-4 py-2 rounded bg-accent text-text-primary-color border border-white hover:bg-accent-hover transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
                [disabled]="securityForm.invalid || isUpdating">
          <span *ngIf="!isUpdating">Изменить пароль</span>
          <span *ngIf="isUpdating" class="flex items-center justify-center">
            <span class="spinner-border spinner-border-sm mr-2" aria-hidden="true"></span>
            Сохранение...
          </span>
        </button>
        <button type="button"
                class="px-4 py-2 rounded border border-gray-300 bg-white text-gray-700 hover:bg-gray-50 transition-colors"
                (click)="resetPasswordForm()">
          Отмена
        </button>
      </div>
    </form>
  </div>
</div>
