<div class="card shadow-sm mb-4">
  <div class="card-header bg-primary text-white">
    <h5 class="mb-0"><i class="bi bi-clipboard-check me-2"></i>Рецензирование</h5>
  </div>
  <div class="card-body">
    <form [formGroup]="formReview">
      <div *ngIf="!existReviewByCurrentUser">
        <div class="mb-4">
          <h6 class="mb-3">Критерии оценивания</h6>
          <div *ngIf="loadingConference" class="text-center">
            <app-loading-spinner size="sm" />
          </div>
          <div *ngIf="!loadingConference" class="row g-3">
            <div *ngFor="let tag of tags" class="col-md-6">
              <div class="card mb-3">
                <div class="card-body">
                  <label class="form-label">{{ tag }}</label>
                  <div class="btn-group-vertical w-100" role="group">
                    <div *ngFor="let mark of reviewsMarks" class="form-check">
                      <input
                        class="form-check-input"
                        type="radio"
                        [name]="tag"
                        [value]="mark"
                        (click)="onMark(tag, mark)"
                      />
                      <label class="form-check-label">{{ mark }}</label>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label">Комментарий к рецензии</label>
          <textarea class="form-control" formControlName="text" rows="4"></textarea>
        </div>

        <button type="button" class="btn btn-primary w-100" (click)="onSaveReview()">Сохранить рецензию</button>
      </div>

      <div *ngIf="existReviewByCurrentUser">
        <div class="mb-4">
          <h6 class="mb-3">Оценки по критериям</h6>
          <div *ngIf="loadingConference" class="text-center">
            <app-loading-spinner size="sm" />
          </div>
          <div *ngIf="!loadingConference" class="row g-3">
            <div *ngFor="let tag of tags" class="col-md-6">
              <div class="card mb-3">
                <div class="card-body">
                  <label class="form-label">{{ tag }}</label>
                  <div class="fw-bold text-primary">
                    {{ reviewByCurrentUser.reviews[tag] }}
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label">Комментарий рецензента</label>
          <textarea class="form-control" readonly rows="4">{{ reviewByCurrentUser.text }}</textarea>
        </div>
      </div>
    </form>
  </div>
</div>
