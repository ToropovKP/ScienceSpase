<div class="row g-4 mb-4">
  <div class="col-md-4">
    <div class="card h-100 shadow-sm">
      <div class="card-body">
        <h5 class="card-title d-flex align-items-center">
          <i class="bi bi-building me-2"></i>Организация
        </h5>
        <p class="card-text">{{ organization }}</p>
      </div>
    </div>
  </div>

  <div class="col-md-4">
    <div class="card h-100 shadow-sm">
      <div class="card-body">
        <h5 class="card-title d-flex align-items-center">
          <i class="bi bi-calendar-range me-2"></i>Даты проведения
        </h5>
        <p class="card-text">
          {{ DateService.formatDate(startDate) }} —
          {{ DateService.formatDate(endDate) }}
        </p>
      </div>
    </div>
  </div>

  <div *ngIf="showParticipantsColumn" class="col-md-4">
    <div class="card h-100 shadow-sm">
      <div class="card-body">
        <h5 class="card-title d-flex align-items-center">
          <i class="bi bi-people me-2"></i>Участники
        </h5>
        <p class="card-text">
          <span *ngIf="showParticipantsCount">{{ countUsers }}</span>
          <a
            *ngIf="showParticipantsLink && participantsLinkVariant === 'participants'"
            href="#"
            class="btn btn-link p-0 ms-2"
            (click)="onParticipantsClick(); $event.preventDefault()"
          >
            Список участников <i class="bi bi-arrow-right"></i>
          </a>
          <a
            *ngIf="showParticipantsLink && participantsLinkVariant === 'downloadAll'"
            href="#"
            class="btn btn-link p-0 ms-2"
            (click)="onDownloadAllClick(); $event.preventDefault()"
          >
            <i class="bi bi-download me-2"></i>Скачать все
          </a>
        </p>
      </div>
    </div>
  </div>
</div>
