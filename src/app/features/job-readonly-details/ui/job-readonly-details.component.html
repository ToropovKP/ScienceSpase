<div class="card shadow-sm mb-4">
  <div class="card-header bg-primary text-white">
    <h5 class="mb-0"><i class="bi bi-info-circle me-2"></i>Основная информация</h5>
  </div>
  <div class="card-body">
    <form [formGroup]="formJob">
      <div class="row g-3 mb-3">
        <div class="col-md-4">
          <label class="form-label">Почта</label>
          <input [readonly]="true" type="text" class="form-control" formControlName="email" />
        </div>
        <div class="col-md-4">
          <app-phone-field
            id="job-view-phone"
            label="Телефон"
            [control]="phoneControl"
            [countryControl]="phoneCountryControl"
            [readonly]="true"
            labelClass="form-label"
            inputClass="form-control"
          />
        </div>
        <div class="col-md-4">
          <label class="form-label">Организация</label>
          <input [readonly]="true" type="text" class="form-control" formControlName="organization" />
        </div>
      </div>

      <div class="row g-3 mb-3">
        <div class="col-md-3">
          <label class="form-label">ORCID</label>
          <input
            [readonly]="true"
            type="text"
            class="form-control text-uppercase"
            mask="SSSS-SSSS-SSSS-SSSS"
            [patterns]="customOrcidPattern"
            formControlName="orcId"
          />
        </div>
        <div class="col-md-3">
          <label class="form-label">РИНЦ ID (Author ID)</label>
          <input [readonly]="true" type="text" class="form-control" formControlName="rincId" />
        </div>
        <div class="col-md-3">
          <label class="form-label">Ученая степень</label>
          <input [readonly]="true" type="text" class="form-control" formControlName="academicDegree" />
        </div>
        <div class="col-md-3">
          <label class="form-label">Ученое звание</label>
          <input [readonly]="true" type="text" class="form-control" formControlName="academicTitle" />
        </div>
      </div>

      <div class="row g-3 mb-3">
        <div class="col-md-12">
          <label class="form-label">Секция</label>
          <input [readonly]="true" type="text" class="form-control" formControlName="section" />
        </div>
      </div>

      <div class="row g-3">
        <div class="col-md-12">
          <label class="form-label">Файлы</label>
          <div class="list-group">
            <a
              *ngFor="let file of files"
              (click)="onDownload(file.uuid)"
              class="list-group-item list-group-item-action d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center"
            >
              <div class="d-flex align-items-center flex-grow-1">
                <i class="bi bi-file-earmark me-2"></i>
                <span>{{ file.originalName }}</span>
              </div>
              <small class="text-muted file-date mt-2 mt-md-0"
                >Добавлено: {{ file.uploadTime | date: 'dd.MM.yyyy HH:mm' }}</small
              >
            </a>
          </div>
        </div>
      </div>
    </form>
  </div>
</div>
