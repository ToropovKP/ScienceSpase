<p-iftalabel class="mb-3">
  <p-password 
    [feedback]="feedback" 
    [fluid]="true" 
    [toggleMask]="toggleMask" 
    [id]="id" 
    [inputId]="inputId || id" 
    [formControl]="control"
    [ngClass]="{'ng-invalid ng-dirty': hasError()}" />
  <label [for]="id">
    {{ label }}
    <span *ngIf="required" class="text-danger">*</span>
  </label>
</p-iftalabel>
