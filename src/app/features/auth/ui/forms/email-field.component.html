<div class="auth-form-field" [class.auth-form-field--error]="showErrorVisual()">
  <label [attr.for]="id" class="auth-form-field__label">
    {{ label }}
  </label>
  <input
    pInputText
    type="email"
    [id]="id"
    [formControl]="control"
    [attr.aria-required]="required ? 'true' : null"
    [placeholder]="placeholder"
    autocomplete="email"
    class="auth-form-field__input w-100"
    [fluid]="true"
    [ngClass]="{ 'auth-field-input--error': showErrorVisual() }"
  />
</div>
