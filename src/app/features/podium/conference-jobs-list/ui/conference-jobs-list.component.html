<div class="mobile-scroll-container">
  <div class="card shadow-sm">
    <div class="card-body p-0">
      <div class="grid-header bg-primary text-white">
        <div class="row g-0 align-items-center">
          <div class="col-3 sortable" (click)="sort('userName')">
            Автор
            <i
              class="bi"
              [class.bi-arrow-up]="sortColumn === 'userName' && sortDirection === 'asc'"
              [class.bi-arrow-down]="sortColumn === 'userName' && sortDirection === 'desc'"
              [class.bi-arrow-down-up]="sortColumn !== 'userName'"
            ></i>
          </div>
          <div class="col-3 sortable" (click)="sort('title')">
            Название
            <i
              class="bi"
              [class.bi-arrow-up]="sortColumn === 'title' && sortDirection === 'asc'"
              [class.bi-arrow-down]="sortColumn === 'title' && sortDirection === 'desc'"
              [class.bi-arrow-down-up]="sortColumn !== 'title'"
            ></i>
          </div>
          <div class="col-3 position-relative sortable" (click)="sort('sectionTitle'); $event.stopPropagation()">
            <div class="d-flex align-items-center">
              <span>Секция</span>
              <i
                class="bi ms-1"
                [class.bi-arrow-up]="sortColumn === 'sectionTitle' && sortDirection === 'asc'"
                [class.bi-arrow-down]="sortColumn === 'sectionTitle' && sortDirection === 'desc'"
                [class.bi-arrow-down-up]="sortColumn !== 'sectionTitle'"
              ></i>
              <i
                class="bi bi-filter ms-1 justify-content-end"
                (click)="sectionFilterOpen = !sectionFilterOpen; $event.stopPropagation()"
              ></i>
            </div>

            <div
              class="section-filter-dropdown"
              *ngIf="sectionFilterOpen"
              (click)="$event.stopPropagation()"
              appClickOutside
              (clickOutside)="sectionFilterOpen = false"
            >
              <div class="filter-options">
                <div *ngFor="let section of sectionFilters" class="form-check">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    [id]="'section-' + section"
                    [checked]="selectedSections.includes(section)"
                    (change)="toggleSectionFilter(section)"
                  />
                  <label class="form-check-label text-black" [for]="'section-' + section">
                    {{ section }}
                  </label>
                </div>
              </div>
            </div>
          </div>
          <div class="col-2 sortable" (click)="sort('dateTime')">
            Обновлено
            <i
              class="bi"
              [class.bi-arrow-up]="sortColumn === 'dateTime' && sortDirection === 'asc'"
              [class.bi-arrow-down]="sortColumn === 'dateTime' && sortDirection === 'desc'"
              [class.bi-arrow-down-up]="sortColumn !== 'dateTime'"
            ></i>
          </div>
          <div class="col-1">Действия</div>
        </div>
      </div>

      <div class="user-list">
        <div *ngIf="!jobs?.length" class="empty-state">
          <i class="bi bi-file-earmark-excel display-5 text-muted mb-3"></i>
          <p>Нет добавленных работ</p>
        </div>

        <div class="user-item" *ngFor="let job of filteredJobs">
          <div class="row g-0 align-items-center">
            <div class="col-3 text-break" [title]="isReviewer ? '-' : job.userName">
              {{ isReviewer ? '-' : job.userName }}
            </div>
            <div class="col-3 text-break">{{ job.title }}</div>
            <div class="col-3 text-break">{{ job.sectionTitle }}</div>
            <div class="col-2">
              {{ DateService.formatDateTime(job.dateTime) }}
            </div>
            <div class="col-1">
              <div class="btn-group">
                <button class="btn btn-sm btn-outline-primary" type="button" (click)="onOpenJob(String(job.id))">
                  <i class="bi bi-eye"></i>
                </button>
                <button class="btn btn-sm btn-outline-success" type="button" (click)="onDownloadJob(job)">
                  <i class="bi bi-download"></i>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
