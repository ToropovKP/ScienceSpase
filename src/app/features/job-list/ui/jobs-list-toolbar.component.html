<div *ngIf="showToolbar" class="d-flex justify-content-between align-items-center mb-4">
  <div>
    <app-breadcrumb-wrapper [items]="breadcrumbItems || []" [home]="homeItem"></app-breadcrumb-wrapper>
  </div>
  <button
    *ngIf="showAddButton"
    type="button"
    class="btn btn-primary d-flex align-items-center"
    (click)="addJob.emit()"
  >
    <span>Добавить работу</span>
  </button>
</div>
